[versions]

kotlin = "2.1.21"
compose = "1.8.2"

[libraries]

kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
kotlin-compilerEmbeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
tschuchortdev-kotlinCompileTesting = { module = "com.github.tschuchortdev:kotlin-compile-testing", version = "1.5.0" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-testJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-testManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
kotest-junit5 = { module = "io.kotest:kotest-runner-junit5", version = "5.9.1" }
mockk = { module = "io.mockk:mockk", version = "1.14.4" }

[plugins]

spotless = { id = "com.diffplug.spotless", version = "6.25.0" }
buildConfig = { id = "com.github.gmazzo.buildconfig", version = "5.6.5" }
androidGradle = { id = "com.android.library", version = "8.10.1" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
vanniktechMaven = { id = "com.vanniktech.maven.publish", version = "0.33.0" }
